<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="How extended producer responsibility works: a product is placed on a national market, its producer registers with a scheme, pays a fee modulated by product criteria, and the scheme uses that money to fund collection, sorting and recycling.">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#0033cc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f6f5f3"/>
  <text x="64" y="108" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" letter-spacing="3" fill="#777169">PPWR · FUNDAMENTALS</text>
  <text x="64" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#0c0a09">Who pays for the waste</text>
  <line x1="313" y1="404" x2="329" y2="404" stroke="#0033cc" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="590" y1="404" x2="606" y2="404" stroke="#0033cc" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="867" y1="404" x2="883" y2="404" stroke="#0033cc" stroke-width="2.5" marker-end="url(#arw)"/>
  <rect x="64" y="318" width="241" height="172" rx="20" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="184.5" y="362" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="#0033cc">01</text>
  <text x="184.5" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">Place on</text>
  <text x="184.5" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">the market</text>
  <rect x="341" y="318" width="241" height="172" rx="20" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="461.5" y="362" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="#0033cc">02</text>
  <text x="461.5" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">Register</text>
  <text x="461.5" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">with a scheme</text>
  <rect x="618" y="318" width="241" height="172" rx="20" fill="#ffffff" stroke="#e7e5e4" stroke-width="2"/>
  <text x="738.5" y="362" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="#0033cc">03</text>
  <text x="738.5" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">Pay a</text>
  <text x="738.5" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#0c0a09">modulated fee</text>
  <rect x="895" y="318" width="241" height="172" rx="20" fill="#0033cc"/>
  <text x="1015.5" y="362" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="rgba(255,255,255,0.85)">04</text>
  <text x="1015.5" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#ffffff">Funds</text>
  <text x="1015.5" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="500" fill="#ffffff">collection</text>
  <text x="1136" y="628" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#a8a29e">getbindu.com</text>
</svg>
